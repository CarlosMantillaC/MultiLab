services:
  laravel_app:
    build:
      context: .
      args:
          UID: ${UID}
          GID: ${GID}
      dockerfile: Dockerfile
    container_name: laravel_app
    volumes:
      - .:/var/www
      - laravel_storage:/var/www/storage
      - laravel_bootstrap_cache:/var/www/bootstrap/cache
    depends_on:
      - mariadbmultilab
    networks:
      - laravel

  scheduler:
      build:
          context: .
          args:
              UID: ${UID}
              GID: ${GID}
          dockerfile: Dockerfile
      container_name: laravel_scheduler
      volumes:
          - .:/var/www
          - laravel_storage:/var/www/storage
          - laravel_bootstrap_cache:/var/www/bootstrap/cache
      depends_on:
          - mariadbmultilab
      command: sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
      networks:
          - laravel

  nginx:
    image: nginx:1.27
    container_name: laravel_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - laravel_storage:/var/www/storage
      - laravel_bootstrap_cache:/var/www/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel_app
    networks:
      - laravel

  mariadbmultilab:
    image: mariadb:11.4
    container_name: laravel_mariadb
    environment:
      MARIADB_DATABASE: laravel
      MARIADB_USER: laravel
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - laravel

networks:
  laravel:

volumes:
  mariadb_data:
  laravel_storage:
  laravel_bootstrap_cache:
